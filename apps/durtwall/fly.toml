# Deploy: fly deploy (a partir de apps/durtwall - build self-contained, sem depender
# do resto do monorepo)
app = "durtone-edge"
primary_region = "gru"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
