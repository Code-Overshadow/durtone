services:
  postgres:
    image: postgres:16-alpine
    container_name: durtone-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: durtone_dev_password
      POSTGRES_DB: durtone
    ports:
      - "55432:5432"
    volumes:
      - durtone-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: durtone-redis-dev
    restart: unless-stopped
    ports:
      - "56379:6379"

volumes:
  durtone-postgres-data:
