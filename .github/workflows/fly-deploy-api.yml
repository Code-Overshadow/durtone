name: fly deploy api

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/**
      - Dockerfile.api
      - fly.api.toml
      - bun.lock
  workflow_dispatch:

concurrency:
  group: fly-deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      # FLY_API_TOKEN aqui é um secret do GitHub Actions (só existe durante o CI, pra
      # autenticar o flyctl) - não tem relação com o FLY_API_TOKEN que é secret de runtime
      # do próprio app durtone-api (usado por flyCerts.ts pra emitir certificados).
      - run: flyctl deploy --config fly.api.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
