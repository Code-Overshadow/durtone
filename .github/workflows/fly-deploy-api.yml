name: fly deploy api

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/**
      - Dockerfile.api
      - fly.api.toml
      - bun.lock
  workflow_dispatch:

concurrency:
  group: fly-deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      # FLY_API_TOKEN e o nome de env var que o flyctl exige pra se autenticar - o valor vem
      # do secret FLY_DEPLOY_TOKEN_API do GitHub (token de deploy escopado a este app), sem
      # relacao com o FLY_API_TOKEN que e secret de runtime do proprio durtone-api (usado por
      # flyCerts.ts pra emitir certificados).
      - run: flyctl deploy --config fly.api.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN_API }}
