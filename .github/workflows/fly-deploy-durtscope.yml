name: fly deploy durtscope

on:
  push:
    branches: [main]
    paths:
      - apps/durtscope/**
      - packages/**
      - Dockerfile.durtscope
      - fly.durtscope.toml
      - bun.lock
  workflow_dispatch:

concurrency:
  group: fly-deploy-durtscope
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@v1
      - run: flyctl deploy --config fly.durtscope.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
