name: quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version-file: agents/durtwall/go.mod
      - run: bun install --frozen-lockfile
      - run: bun run --filter '*' check
      - run: bun test apps/api/src apps/durtscope/src apps/durtguardian/src packages/crypto/src packages/identity-providers/src
      - run: go test ./...
        working-directory: agents/durtwall
      - run: go vet ./...
        working-directory: agents/durtwall
      - run: bun run build
        working-directory: apps/dashboard
